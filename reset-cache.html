<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Actualizando RindeApp</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f6fa;
      color: #1a2230;
      text-align: center;
      padding: 24px;
    }
    .box {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 28px 22px;
      box-shadow: 0 8px 30px rgba(20, 35, 70, .12);
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0; color: #6b7688; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Actualizando RindeApp...</h1>
    <p>Estoy limpiando la cache vieja del navegador. En unos segundos volvera a abrir la app.</p>
  </div>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
      } catch (e) {
        console.warn('No se pudo limpiar toda la cache', e);
      }
      location.replace('./?fresh=' + Date.now() + '#/dashboard');
    })();
  </script>
</body>
</html>
